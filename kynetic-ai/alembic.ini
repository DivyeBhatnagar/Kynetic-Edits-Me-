# Alembic configuration file for Kynetic AI
# All services share one PostgreSQL database; migrations live in libs/db_models/migrations/

[alembic]
# Path to migration scripts
script_location = libs/db_models/migrations

# Template used to generate migration filenames
file_template = %%(year)d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d_%%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file's comment
timezone = UTC

# Truncate long revision message slugs at this many characters
truncate_slug_length = 40

# The SQLAlchemy database URL — overridden via DATABASE_URL env var in env.py
sqlalchemy.url = postgresql+asyncpg://kynetic:kynetic@localhost:5432/kynetic

[post_write_hooks]
# Run ruff formatter on newly generated migrations
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
