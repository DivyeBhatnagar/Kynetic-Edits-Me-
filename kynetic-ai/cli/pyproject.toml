[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kynetic-cli"
version = "1.0.0"
description = "Kynetic AI — CLI-First Compute Marketplace"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.scripts]
kynetic = "kynetic_cli.cli:cli"
