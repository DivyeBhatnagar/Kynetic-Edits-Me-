version: "3.9"

# ── Kynetic AI — Local Development Docker Compose (Phase 12 — COMPLETE STACK)
# Infrastructure: PostgreSQL, Redis
# Services: API Gateway, Auth, Host, Marketplace, Wallet/Billing, Provisioning,
#           Security, AI Router/Copilot, Reputation/Pricing, Notifications, Monitoring
# Workers: Celery workers + Beat scheduler for all services
#
# Usage:
#   docker-compose up --build                     # Start full stack
#   docker-compose up auth_service wallet_billing_service  # Start specific services
#   docker-compose --profile migrate up migrate   # Run DB migrations
#   docker-compose exec auth_service pytest       # Run tests
#   docker-compose logs -f ai_router_service      # Tail logs for a service

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kynetic
      POSTGRES_PASSWORD: kynetic
      POSTGRES_DB: kynetic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kynetic -d kynetic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API Gateway (port 8000) ─────────────────────────────────────────────────
  api_gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn services.api_gateway.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://kynetic:kynetic@postgres:5432/kynetic
      JWT_SECRET_KEY: dev_secret_change_in_production_12345
      AUTH_SERVICE_URL: http://auth_service:8001
      HOST_SERVICE_URL: http://host_service:8002
    volumes:
      - ./backend/libs:/app/libs
      - ./backend/services/api_gateway:/app/services/api_gateway
    depends_on:
      redis:
        condition: service_healthy
      auth_service:
        condition: service_started
    restart: unless-stopped

  # ── Auth Service (port 8001) ────────────────────────────────────────────────
  auth_service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn services.auth_service.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+asyncpg://kynetic:kynetic@postgres:5432/kynetic
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: dev_secret_change_in_production_12345
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      BCRYPT_ROUNDS: "10"   # Lower rounds in dev for faster tests
    volumes:
      - ./backend/libs:/app/libs
      - ./backend/services/auth_service:/app/services/auth_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Host Service (port 8002) ───────────────────────────────────────────────
  host_service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn services.host_service.main:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+asyncpg://kynetic:kynetic@postgres:5432/kynetic
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: dev_secret_change_in_production_12345
      JWT_ALGORITHM: HS256
      VRAM_MISMATCH_TOLERANCE_PCT: "10.0"
      REBENCHMARK_INTERVAL_HOURS: "48"
      HEARTBEAT_TIMEOUT_SECONDS: "120"
    volumes:
      - ./backend/libs:/app/libs
      - ./backend/services/host_service:/app/services/host_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Worker — Host Service background tasks ─────────────────────────
  host_service_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      celery -A services.host_service.celery_app.celery_app worker
        --loglevel=info
        --queues=celery
        --concurrency=4
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://kynetic:kynetic@postgres:5432/kynetic
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: dev_secret_change_in_production_12345
      REBENCHMARK_INTERVAL_HOURS: "48"
      HEARTBEAT_TIMEOUT_SECONDS: "120"
    volumes:
      - ./backend/libs:/app/libs
      - ./backend/services/host_service:/app/services/host_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Beat — Periodic task scheduler ────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      celery -A services.host_service.celery_app.celery_app beat
        --loglevel=info
        --scheduler celery.beat:PersistentScheduler
        --schedule /tmp/celerybeat-schedule
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://kynetic:kynetic@postgres:5432/kynetic
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: dev_secret_change_in_production_12345
      REBENCHMARK_INTERVAL_HOURS: "48"
      HEARTBEAT_TIMEOUT_SECONDS: "120"
    volumes:
      - ./backend/libs:/app/libs
      - ./backend/services/host_service:/app/services/host_service
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── DB Migration runner ────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        sleep 3 &&
        alembic upgrade head &&
        echo 'All migrations complete.'
      "
    environment:
      DATABASE_URL: postgresql+asyncpg://kynetic:kynetic@postgres:5432/kynetic
    volumes:
      - ./backend/libs:/app/libs
      - ./backend/services/auth_service:/app/services/auth_service
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

  # ── Marketplace Service (port 8003) ───────────────────────────────────────
  marketplace_service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn services.marketplace_service.main:app --host 0.0.0.0 --port 8003 --reload
    ports:
      - "8003:8003"
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+asyncpg://kynetic:kynetic@postgres:5432/kynetic
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: dev_secret_change_in_production_12345
      JWT_ALGORITHM: HS256
      HOST_SERVICE_URL: http://host_service:8002
      USD_TO_INR_RATE: "84.0"
    volumes:
      - ./backend/libs:/app/libs
      - ./backend/services/marketplace_service:/app/services/marketplace_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Marketplace Celery Worker ──────────────────────────────────────────────
  marketplace_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      celery -A services.marketplace_service.celery_app.celery_app worker
        --loglevel=info --queues=celery --concurrency=2
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://kynetic:kynetic@postgres:5432/kynetic
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      USD_TO_INR_RATE: "84.0"
    volumes:
      - ./backend/libs:/app/libs
      - ./backend/services/marketplace_service:/app/services/marketplace_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

