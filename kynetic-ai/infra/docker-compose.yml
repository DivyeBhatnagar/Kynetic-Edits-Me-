      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: dev_secret_change_in_production_12345
      JWT_ALGORITHM: HS256
      STRIPE_SECRET_KEY: sk_test_REPLACE_WITH_YOUR_STRIPE_KEY
      STRIPE_WEBHOOK_SECRET: whsec_REPLACE_WITH_YOUR_WEBHOOK_SECRET
      STRIPE_PUBLISHABLE_KEY: pk_test_REPLACE_WITH_YOUR_PUBLISHABLE_KEY
      USD_TO_INR_RATE: "84.0"
    volumes:
      - ./backend/libs:/app/libs
