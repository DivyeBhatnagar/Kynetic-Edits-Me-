      PROVISIONING_SERVICE_URL: http://provisioning_service:8005
      WALLET_BILLING_SERVICE_URL: http://wallet_billing_service:8004
      HOST_SERVICE_URL: http://host_service:8002
      SCANNER_MOCK: "true"
      JWT_SECRET_KEY: dev_secret_change_in_production_12345
      ADMIN_JWT_SECRET_KEY: dev_admin_secret_change_in_production
    volumes:
