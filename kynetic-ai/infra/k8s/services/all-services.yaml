# ── Kynetic AI — All Core Services K8s Deployments ──────────────────────────
#
# auth-service, marketplace-service, wallet-billing-service,
# ai-router-copilot-service, reputation-pricing-service,
# security-service, host-service, notifications-service, monitoring-service
#
# Each follows the same pattern as api-gateway.yaml but with service-specific
# resource limits, ports, and HPA thresholds.
---
# ─────────────────────────────────────────────────────────
# Auth Service (:8001)
# ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: kynetic-production
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-service
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/kynetic/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: kynetic-shared-secrets
            - secretRef:
                name: auth-secrets
          env:
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: kynetic-production
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 80
      targetPort: 8001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: kynetic-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---

# ─────────────────────────────────────────────────────────
# Marketplace Service (:8002)
# ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-service
  namespace: kynetic-production
  labels:
    app: marketplace-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketplace-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: marketplace-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: marketplace-service
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/kynetic/marketplace-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          envFrom:
            - secretRef:
                name: kynetic-shared-secrets
