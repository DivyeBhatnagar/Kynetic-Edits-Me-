metadata:
  name: marketplace-service
  namespace: kynetic-production
spec:
  type: ClusterIP
  selector:
    app: marketplace-service
  ports:
    - port: 80
      targetPort: 8002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: marketplace-service-hpa
  namespace: kynetic-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: marketplace-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---

# ─────────────────────────────────────────────────────────
# Wallet & Billing Service (:8004)
# ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
