  selector:
    matchLabels:
      app: wallet-billing-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: wallet-billing-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
    spec:
      terminationGracePeriodSeconds: 45  # Extra grace: in-flight transactions
      containers:
        - name: wallet-billing-service
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/kynetic/wallet-billing-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
          envFrom:
            - secretRef:
                name: kynetic-shared-secrets
            - secretRef:
                name: billing-secrets
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: RAZORPAY_MOCK_MODE
              value: "false"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          livenessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 8
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-billing-service
  namespace: kynetic-production
spec:
  type: ClusterIP
  selector:
    app: wallet-billing-service
  ports:
    - port: 80
      targetPort: 8004
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wallet-billing-hpa
  namespace: kynetic-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wallet-billing-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---

# ─────────────────────────────────────────────────────────
# AI Router & Copilot Service (:8005)
# ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-router-copilot-service
  namespace: kynetic-production
  labels:
    app: ai-router-copilot-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-router-copilot-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-router-copilot-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-router-copilot-service
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/kynetic/ai-router-copilot-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
          envFrom:
            - secretRef:
                name: kynetic-shared-secrets
            - secretRef:
                name: ai-router-secrets
          env:
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-router-copilot-service
  namespace: kynetic-production
spec:
  type: ClusterIP
  selector:
    app: ai-router-copilot-service
  ports:
    - port: 80
      targetPort: 8005
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-router-copilot-hpa
  namespace: kynetic-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-router-copilot-service
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
---

