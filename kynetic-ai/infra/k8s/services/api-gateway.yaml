# ── Kynetic AI — API Gateway K8s Deployment ─────────────────────────────────
#
# Pattern used for ALL services:
#   Deployment → HPA (CPU-based autoscaling) → ClusterIP Service → Ingress
#
# Liveness probe: /health — confirms process is alive
# Readiness probe: /health — controls when pod receives traffic
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: kynetic-production
  labels:
    app: api-gateway
    version: "1.0"
spec:
  replicas: 2  # HPA takes over after initial deploy
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime: never reduce below desired count
  template:
    metadata:
      labels:
        app: api-gateway
        version: "1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30

      # Ensure pods spread across availability zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: api-gateway

      containers:
        - name: api-gateway
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/kynetic/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000

          # All secrets from ExternalSecret (backed by AWS Secrets Manager / Vault)
          envFrom:
            - secretRef:
                name: kynetic-shared-secrets
            - secretRef:
                name: api-gateway-secrets
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                # Graceful shutdown: wait for in-flight requests
                command: ["/bin/sh", "-c", "sleep 5"]

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: kynetic-production
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: kynetic-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 min cooldown before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
