global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: 'slack-warning-channel'
  routes:
    - match:
        severity: critical
      receiver: 'critical-pagerduty-and-slack'
    - match:
        severity: warning
      receiver: 'slack-warning-channel'

receivers:
  - name: 'critical-pagerduty-and-slack'
    slack_configs:
      - channel: '#kynetic-ops-critical'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .CommonAnnotations.summary }}'
        text: "{{ .CommonAnnotations.description }}\n*Environment*: Production\n*Severity*: Critical"
    pagerduty_configs:
      - service_key: 'pd-kynetic-ops-integration-key'
        send_resolved: true

  - name: 'slack-warning-channel'
    slack_configs:
      - channel: '#kynetic-ops-alerts'
        send_resolved: true
        title: '⚠️ WARNING: {{ .CommonAnnotations.summary }}'
        text: "{{ .CommonAnnotations.description }}\n*Severity*: Warning"
