server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: kynetic_containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: kynetic_logs
          env: production
          __path__: /var/log/containers/*.log

    pipeline_stages:
      - json:
          expressions:
            correlation_id: correlation_id
            request_id: request_id
            service_name: service_name
            level: level
            event: event
            timestamp: timestamp
      - labels:
          correlation_id:
          service_name:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339
