    - secretKey: ACCESS_TOKEN_EXPIRE_MINUTES
      remoteRef:
        key: kynetic/production/auth/access-token-expire-minutes
    - secretKey: REFRESH_TOKEN_EXPIRE_DAYS
      remoteRef:
        key: kynetic/production/auth/refresh-token-expire-days
    - secretKey: BCRYPT_ROUNDS
      remoteRef:
        key: kynetic/production/auth/bcrypt-rounds

