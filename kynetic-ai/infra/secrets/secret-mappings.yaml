# ── Kynetic AI — External Secrets Operator Mappings ─────────────────────────
#
# ExternalSecret CRDs pull secrets from AWS Secrets Manager or HashiCorp Vault
# and materialize them as Kubernetes Secret objects in each namespace.
#
# Prerequisites:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#     -n external-secrets --create-namespace
#
# All secrets must be stored in AWS Secrets Manager under:
#   kynetic/{environment}/{service}/{key}
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        # IRSA — IAM Role for Service Account (attached to external-secrets SA)
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
# ── Shared Secrets (DATABASE_URL, REDIS_URL, JWT_SECRET_KEY) ─────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kynetic-shared-secrets
  namespace: kynetic-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: kynetic-shared-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: kynetic/production/shared/database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: kynetic/production/shared/redis-url
    - secretKey: CELERY_BROKER_URL
      remoteRef:
        key: kynetic/production/shared/celery-broker-url
    - secretKey: CELERY_RESULT_BACKEND
      remoteRef:
        key: kynetic/production/shared/celery-result-backend
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: kynetic/production/shared/jwt-secret-key

---
